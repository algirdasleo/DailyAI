# Source registry.
# - `type` picks the Source class (see SOURCE_REGISTRY in factory.py);
# - `authority` is a float [0, 1], used as indication how much to trust this source.
# - `ai_relevant` is accepted by rss and scrape only:
#     - 'always' trusts every item;
#     - 'filter' keeps only AI content (relevance.py).
#
# rss: standard feed.
#       - type: rss
#         name: OpenAI Blog
#         url: https://openai.com/blog/rss.xml
#         authority: 1.0             # optional
#         ai_relevant: always        # optional
#
# scrape: for sites with no feed. CSS selectors pick each item card and its parts.
#       - type: scrape
#         name: Anthropic News
#         url: https://www.anthropic.com/news
#         item: "a[href^='/news/']"  # CSS selector for each item container
#         title: "h3"                # title text within the item
#         link: "a"                  # optional; <a> whose href is the article, defaults to the item's first <a>
#         date: "time"               # required; element with a parseable datetime
#         authority: 0.8             # optional
#         ai_relevant: filter        # optional
#
# hackernews: front-page HN stories, always filtered for AI relevance.
#       - type: hackernews
#         authority: 0.5             # optional
#
# hf_papers: trending Hugging Face papers, ranked by upvotes, never filtered
#      for AI relevance.
#       - type: hf_papers
#         pool: 60                   # optional, how many candidates to fetch and rank by upvotes
#         top_k: 15                  # optional, how many of the ranked candidates to keep
#         authority: 0.75            # optional
sources:
  - type: rss
    name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    authority: 1.0
    ai_relevant: always
