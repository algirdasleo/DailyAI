# Source registry. Each entry's `type` is looked up in SOURCE_REGISTRY
# (see dailyai/factory.py); remaining keys are passed as kwargs to that
# Source class. `window_hours` comes from Settings, not here - it's passed
# to fetch() at ingest time, not baked into the source.
#
# rss: `authority` (0-1) feeds the ranking score.
#      `ai_relevant: always` trusts every item; `filter` runs the keyword gate.
#
# scrape: listing-page scraper for sites with no feed. CSS selectors pick each
#      item card and its parts. A `date` selector is REQUIRED - items without a
#      parseable date are dropped, so the 24h window stays honest. Anchor on
#      stable attributes (<time datetime>, a[href^=...]), not style classes.
#        - type: scrape
#          name: Anthropic News
#          url: https://www.anthropic.com/news
#          item: "a[href^='/news/']"   # CSS selector for each item container
#          title: "h3"                  # title text within the item
#          link: "a"                    # <a> whose href is the article (optional)
#          date: "time"                 # element with a parseable datetime (required)
#          authority: 0.8
#          ai_relevant: filter
sources:
  - type: rss
    name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    authority: 1.0
    ai_relevant: always
  - type: rss
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    authority: 1.0
    ai_relevant: always
